version: '3'

# Глобальные переменные проекта
vars:
  GO_VERSION: '1.25.5'
  GOLANGCI_LINT_VERSION: 'v2.1.5'
  GCI_VERSION: 'v0.13.6'
  GOFUMPT_VERSION: 'v0.8.0'
  OGEN_VERSION: 'v1.18.0'
  YQ_VERSION: 'v4.45.2'
  ENVSUBST_VERSION: 'v1.4.3'
  MOCKERY_VERSION: 'v2.53.3'

  BIN_DIR: '{{.ROOT_DIR}}/bin'
  GOLANGCI_LINT: '{{.BIN_DIR}}/golangci-lint'
  GCI: '{{.BIN_DIR}}/gci'
  GOFUMPT: '{{.BIN_DIR}}/gofumpt'
  OGEN: '{{.BIN_DIR}}/ogen'
  YQ: '{{.BIN_DIR}}/yq'
  ENVSUBST: '{{.BIN_DIR}}/envsubst'
  ENVDIR: '{{.ROOT_DIR}}/deploy/env'
  MOCKERY: "{{.BIN_DIR}}/mockery"

  NODE_MODULES_DIR: '{{.ROOT_DIR}}/node_modules/.bin'
  REDOCLY: '{{.NODE_MODULES_DIR}}/redocly'

  OPEN_API_BONUS_V1_BASE: '{{.ROOT_DIR}}/api/bonus/v1/bonus.openapi.yaml'
  OPEN_API_BONUS_V1_BUNDLE: '{{.ROOT_DIR}}/api/bundles/bonus.openapi.v1.bundle.yaml'

  OPEN_API_ACCRUAL_V1_BASE: '{{.ROOT_DIR}}/api/accrual/v1/accrual.openapi.yaml'
  OPEN_API_ACCRUAL_V1_BUNDLE: '{{.ROOT_DIR}}/api/bundles/accrual.openapi.v1.bundle.yaml'

  OPEN_API_FILES: '{{.ROOT_DIR}}/api/bundles'

  SERVICES: bonus,accrual
  COVERAGE_DIR: '{{.ROOT_DIR}}/coverage'
  COVERAGE_FILE: total.out

tasks:
  install-formatters:
    desc: "Устанавливает форматтеры gci и gofumpt в ./bin"
    cmds:
      - |
        [ -f {{.GOFUMPT}} ] || {
          echo '📦 Устанавливаем gofumpt {{.GOFUMPT_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}
        }
        [ -f {{.GCI}} ] || {
          echo '📦 Устанавливаем gci {{.GCI_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install github.com/daixiang0/gci@{{.GCI_VERSION}}
        }
    status:
      - test -x {{.GOFUMPT}}
      - test -x {{.GCI}}

  format:
    desc: "Форматирует весь проект gofumpt + gci"
    deps: [ install-formatters ]
    cmds:
      - |
        echo "🧼 Форматируем через gofumpt ..."
        find . -type f -name '*.go' ! -path '*/mocks/*' -exec {{.GOFUMPT}} -extra -w {} +
      - |
        echo "🎯 Сортируем импорты через gci ..."
        find . -type f -name '*.go' ! -path '*/mocks/*' -exec {{.GCI}} write -s standard -s default -s "prefix(github.com/delyke/gophermat_bonus_system/)" {} +

  install-golangci-lint:
    desc: "Устанавливает golangci-lint в каталог bin"
    cmds:
      - |
        [ -f {{.GOLANGCI_LINT}} ] || {
          mkdir -p {{.BIN_DIR}}
          echo "📦 Устанавливаем golangci-lint {{.GOLANGCI_LINT_VERSION}}..."
          GOBIN={{.BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
        }
    status:
      - test -x {{.GOLANGCI_LINT}}

  lint:
    desc: "Запускает golangci-lint для всех модулей"
    deps: [ install-golangci-lint ]
    cmds:
      - '{{.GOLANGCI_LINT}} run ./... --config=.golangci.yml'

  redocly-cli:install:
    desc: Установить локально Redocly CLI
    cmds:
      - |
        [ -f {{.REDOCLY}} ] || {
          npm ci
        } || {
          echo "📦 Устанавливаем redocly-cli..."
          npm install
        }

  redocly-cli:bonus-v1-bundle:
    desc: Собрать OpenAPI Bonus в один файл через локальный redocly
    deps: [ redocly-cli:install ]
    cmds:
      - '{{.REDOCLY}} bundle {{.OPEN_API_BONUS_V1_BASE}} -o {{.OPEN_API_BONUS_V1_BUNDLE}}'

  redocly-cli:accrual-v1-bundle:
    desc: Собрать OpenAPI Accrual в один файл через локальный redocly
    deps: [ redocly-cli:install ]
    cmds:
      - '{{.REDOCLY}} bundle {{.OPEN_API_ACCRUAL_V1_BASE}} -o {{.OPEN_API_ACCRUAL_V1_BUNDLE}}'

  redocly-cli:bundle:
    desc: Собрать все схемы OpenAPI в общие файлы через локальный redocly
    deps: [ redocly-cli:install ]
    cmds:
      - task: redocly-cli:bonus-v1-bundle
      - task: redocly-cli:accrual-v1-bundle

  ogen:install:
    desc: "Скачивает ogen в папку bin"
    cmds:
      - |
        [ -f {{.OGEN}} ] || {
          mkdir -p {{.BIN_DIR}}
          GOBIN={{.BIN_DIR}} go install github.com/ogen-go/ogen/cmd/ogen@{{.OGEN_VERSION}}
        }

  ogen:gen:
    desc: "Генерация Go-кода из всех OpenAPI-деклараций с x-ogen"
    deps: [ ogen:install, yq:install ]
    cmds:
      - task: redocly-cli:bundle
      - |
        find {{.OPEN_API_FILES}} -name '*.yaml' -o -name '*.yml' | while read -r file; do
          if [ -f "$file" ] && grep -q 'x-ogen:' "$file"; then
            echo "🚀 Generating from: $file"
            target=$({{.YQ}} e '."x-ogen".target' "$file")
            package=$({{.YQ}} e '."x-ogen".package' "$file")
            echo "📁 Target: $target"
            echo "📦 Package: $package"
            {{.OGEN}} \
              --target "$target" \
              --package "$package" \
              --clean \
              "$file" || exit 1
          fi
        done

  yq:install:
    desc: "Устанавливает yq в bin/ при необходимости"
    cmds:
      - |
        [ -f {{.YQ}} ] || {
          echo '📦 Installing yq...'
          GOBIN={{.BIN_DIR}} go install github.com/mikefarah/yq/v4@{{.YQ_VERSION}}
        }

  env:install-envsubst:
    desc: "Устанавливает envsubst в bin/"
    cmds:
      - |
        [ -f {{.ENVSUBST}} ] || {
          echo "📦 Устанавливаем envsubst версии {{.ENVSUBST_VERSION}}..."
          GOBIN={{.BIN_DIR}} go install github.com/a8m/envsubst/cmd/envsubst@{{.ENVSUBST_VERSION}}
        }
        echo "✅ envsubst установлен: {{.ENVSUBST}}"

  env:generate:
    desc: "Генерирует .env файлы для всех сервисов из шаблонов и единого файла конфигурации"
    deps: [ env:install-envsubst ]
    cmds:
      - |
        ENV_FILE="{{.ENVDIR}}/.env"
        TEMPLATE_FILE="{{.ENVDIR}}/.env.template"
        SCRIPT="{{.ENVDIR}}/generate-env.sh"
        
        if [ ! -f "$ENV_FILE" ]; then
          if [ -f "$TEMPLATE_FILE" ]; then
            echo "🔄 Файл $ENV_FILE не найден, создаем из шаблона $TEMPLATE_FILE"
            cp "$TEMPLATE_FILE" "$ENV_FILE"
            echo "✅ Создан файл $ENV_FILE. Проверьте и отредактируйте значения переменных при необходимости."
          else
            echo "❌ Шаблон $TEMPLATE_FILE не найден!"
            exit 1
          fi
        fi
        
        chmod +x "$SCRIPT"
        # Передаем список сервисов в виде строки с разделителями-запятыми
        export SERVICES="{{.SERVICES}}"
        ENV_SUBST={{.ENVSUBST}} bash "$SCRIPT"
  up-core:
    desc: Поднять core контейнеры
    dir: deploy/compose/core
    cmds:
      - echo "[task] 🚀 Поднимаем core контейнеры"
      - docker compose up --build --detach
  down-core:
    desc: Остановить и удалить core контейнеры
    dir: deploy/compose/core
    cmds:
      - echo "[task] 🛑 Останавливаем core контейнеры"
      - docker compose down --volumes
  up-bonus:
    desc: Поднять Bonus сервис и все его зависимости
    dir: deploy/compose/bonus
    cmds:
      - echo "[task] 📦 Поднимаем Bonus с зависимостями"
      - docker compose up --build --detach
  down-bonus:
    desc: Остановить и удалить Bonus сервис и все его зависимости
    dir: deploy/compose/bonus
    cmds:
      - echo "[task] 🛑 Останавливаем Bonus с зависимостями"
      - docker compose down --volumes
  up-accrual:
    desc: Поднять Accrual сервис и все его зависимости
    dir: deploy/compose/accrual
    cmds:
      - echo "[task] 📦 Поднимаем Accrual с зависимостями"
      - docker compose up --build --detach
  down-accrual:
    desc: Остановить и удалить Accrual сервис и все его зависимости
    dir: deploy/compose/accrual
    cmds:
      - echo "[task] 🛑 Останавливаем Accrual с зависимостями"
      - docker compose down --volumes
  up-all:
    desc: Поднять все сервисы по очереди вместе с зависимостями
    cmds:
      - task up-core
      - task up-accrual
      - task up-bonus
  down-all:
    desc: Остановить и удалить все сервисы по очереди вместе с зависимостями
    cmds:
      - task down-core
      - task down-accrual
      - task down-bonus
  mockery:install:
    desc: "Устанавливает mockery в ./bin"
    cmds:
      - |
        [ -f {{.MOCKERY}} ] || {
          echo '📦 Installing mockery...'
          GOBIN={{.BIN_DIR}} go install github.com/vektra/mockery/v2@{{.MOCKERY_VERSION}}
        }
    status:
      - test -x {{.MOCKERY}}

  mockery:gen:
    desc: "Генерирует моки интерфейсов с помощью mockery"
    deps: [ mockery:install ]
    cmds:
      - |
        echo '🧪 Генерация моков...'
        {{.MOCKERY}}

  test-coverage:
    desc: "Тесты с покрытием бизнес-логики (service/repository), отчёт по каждому модулю + общий"
    cmds:
      - |
        echo "🧪 Запускаем расчёт покрытия..."
        rm -rf {{.COVERAGE_DIR}}
        mkdir -p {{.COVERAGE_DIR}}

        ERR=0
        for mod in {{.MODULES}}; do
          echo "📦 Обрабатываем модуль: $mod"

          TARGET_PKGS=$(go list ./$mod/... \
            | grep -E '/(internal/(service|repository))' \
            | grep -vE '/(mocks|testdata|pkg|api|proto|pb|cmd)' \
            | paste -sd "," -)

          if [ -z "$TARGET_PKGS" ]; then
            echo "⚠️  Нет подходящих пакетов в $mod"
            continue
          fi

          go test -coverpkg="$TARGET_PKGS" \
            -coverprofile={{.COVERAGE_DIR}}/$mod.out \
            -covermode=atomic \
            $(echo "$TARGET_PKGS" | tr "," " ") || ERR=1
        done

        if [ $ERR -ne 0 ]; then
          echo "❌ Ошибки во время тестов"
          exit $ERR
        fi

        echo
        echo "📊 Покрытие по каждому модулю:"
        for mod in {{.MODULES}}; do
          OUTFILE="{{.COVERAGE_DIR}}/$mod.out"
          if [ -f "$OUTFILE" ]; then
            printf " • %s: " "$mod"
            go tool cover -func="$OUTFILE" | tail -n1
          fi
        done

        echo
        echo "📦 Склеиваем все покрытия..."
        {
          echo "mode: atomic"
          find {{.COVERAGE_DIR}} -type f -name '*.out' ! -name '{{.COVERAGE_FILE}}' \
            -exec grep -h -v "^mode:" {} +
        } > {{.COVERAGE_DIR}}/{{.COVERAGE_FILE}}

        echo
        echo "🧾 Общее покрытие по всем модулям:"
        go tool cover -func={{.COVERAGE_DIR}}/{{.COVERAGE_FILE}} | tail -n1

  coverage:html:
    desc: "Генерирует HTML-отчёт покрытия и открывает его в браузере"
    deps: [ test-coverage ]
    cmds:
      - |
        OUTPUT={{.COVERAGE_DIR}}/coverage.html
        echo "🌐 Генерируем HTML-отчёт..."
        go tool cover -html={{.COVERAGE_DIR}}/{{.COVERAGE_FILE}} -o $OUTPUT

        echo "🚀 Открываем $OUTPUT"
        if command -v open &> /dev/null; then
          open $OUTPUT  # macOS
        elif command -v xdg-open &> /dev/null; then
          xdg-open $OUTPUT  # Linux
        else
          echo "📂 Отчёт сохранён в $OUTPUT (открой вручную)"
        fi